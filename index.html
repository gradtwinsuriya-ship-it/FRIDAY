    <script>
      // Ignore WebSocket disconnection errors in iframe preview when HMR is disabled
      window.addEventListener('unhandledrejection', function(event) {
        var msg = event && event.reason && (event.reason.message || String(event.reason));
        if (msg && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite:ws') !== -1 || msg.indexOf('ws:') !== -1)) {
          event.preventDefault();
        }
      });
    </script>
